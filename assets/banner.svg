<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="240" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="240" fill="url(#grid)"/>
  </g>

  <!-- Background Dynamic Animated & Visual Elements (Kept BEHIND/AWAY from central text foreground) -->
  
  <!-- Pulse Waveform / Controller Signal (Bottom Subtle Graphic) -->
  <g opacity="0.25">
    <path d="M 0 190 Q 100 170, 200 190 T 400 190 T 600 180 T 800 190" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
        M 0 190 Q 100 170, 200 190 T 400 190 T 600 180 T 800 190;
        M 0 185 Q 100 205, 200 180 T 400 200 T 600 190 T 800 185;
        M 0 190 Q 100 170, 200 190 T 400 190 T 600 180 T 800 190" />
    </path>
    <path d="M 0 205 Q 150 220, 300 200 T 600 210 T 800 200" fill="none" stroke="#a855f7" stroke-width="2">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M 0 205 Q 150 220, 300 200 T 600 210 T 800 200;
        M 0 210 Q 150 195, 300 215 T 600 195 T 800 210;
        M 0 205 Q 150 220, 300 200 T 600 210 T 800 200" />
    </path>
  </g>

  <!-- Glowing Orbs (Distanced from text center) -->
  <circle cx="90" cy="50" r="40" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="710" cy="180" r="50" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="45;55;45" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Controller D-Pad Graphic Element (Left Side Accent) -->
  <g transform="translate(60, 95)" opacity="0.4">
    <rect x="15" y="0" width="10" height="40" rx="3" fill="#818cf8"/>
    <rect x="0" y="15" width="40" height="10" rx="3" fill="#818cf8"/>
    <circle cx="20" cy="20" r="3" fill="#0f172a"/>
  </g>

  <!-- Action Buttons Graphic Element (Right Side Accent) -->
  <g transform="translate(690, 85)" opacity="0.4">
    <circle cx="20" cy="5" r="7" fill="#38bdf8"/>
    <circle cx="35" cy="20" r="7" fill="#f43f5e"/>
    <circle cx="5" cy="20" r="7" fill="#a855f7"/>
    <circle cx="20" cy="35" r="7" fill="#34d399"/>
  </g>

  <!-- Dynamic Animated Status Pills (Top Right & Left Borders) -->
  <g id="status-pills">
    <!-- Pill 1: Hall Effect -->
    <rect x="520" y="22" width="115" height="24" rx="12" fill="url(#card-glow)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="532" cy="34" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="543" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Hall Effect</text>

    <!-- Pill 2: Open Firmware -->
    <rect x="645" y="22" width="125" height="24" rx="12" fill="url(#card-glow)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="657" cy="34" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="668" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">GP2040-CE / Linux</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Crisp & High Contrast, Unobstructed) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="28" font-weight="800" fill="url(#title-gradient)" letter-spacing="0.5">
      AWESOME ELITE GAMING CONTROLLERS
    </text>

    <!-- Subtitle -->
    <text x="400" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Commercial Hardware, Hall Effect Sticks, Remapping Tools &amp; Open-Source Firmware
    </text>

    <!-- Badge Tagline in Foreground -->
    <rect x="270" y="168" width="260" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="400" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">
      🎮 Xbox Elite • Scuf • DualSense Edge • GP2040-CE
    </text>
  </g>
</svg>
